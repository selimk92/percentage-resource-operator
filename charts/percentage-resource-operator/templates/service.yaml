{{- if .Values.webhook.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "operator.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ include "operator.name" . }}
  ports:
  - port: 443
    targetPort: 9443
    name: webhook
{{- end }}
