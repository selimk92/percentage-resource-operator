---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-policy-percentagepolicy-io-v1alpha1-percentageresourcepolicy
  failurePolicy: Fail
  name: mpercentageresourcepolicy-v1alpha1.kb.io
  rules:
  - apiGroups:
    - policy.percentagepolicy.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - percentageresourcepolicies
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-v1-pod
  failurePolicy: Ignore
  name: mpod.percentagepolicy.io
  rules:
  - apiGroups:
    - ""
    apiVersions:
    - v1
    operations:
    - CREATE
    resources:
    - pods
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-policy-percentagepolicy-io-v1alpha1-percentageresourcepolicy
  failurePolicy: Fail
  name: vpercentageresourcepolicy-v1alpha1.kb.io
  rules:
  - apiGroups:
    - policy.percentagepolicy.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - percentageresourcepolicies
  sideEffects: None
